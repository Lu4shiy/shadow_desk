<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shadow Deck</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #eee; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Экран загрузки */
    #loading-screen { position: fixed; inset: 0; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; transition: opacity 0.5s ease; }
    .spinner { width: 50px; height: 50px; border: 4px solid #333; border-top-color: #9b59b6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Экран регистрации */
    #register-screen { display: none; padding: 20px; flex-direction: column; justify-content: center; height: 100%; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; color: #aaa; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 16px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: #aaa; }
    button { padding: 15px; border: none; border-radius: 8px; background: #9b59b6; color: white; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    button:active { background: #8e44ad; }

    /* Главный экран */
    #main-screen { display: none; flex-direction: column; height: 100%; }
    .header { display: flex; justify-content: space-between; padding: 15px; background: #1a1a1a; border-bottom: 1px solid #333; }
    .profile-info { display: flex; gap: 10px; align-items: center; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; object-fit: cover; border: 2px solid #9b59b6; }
    .names h3 { font-size: 16px; margin-bottom: 2px; }
    .names p { font-size: 12px; color: #888; }
    .level-xp { font-size: 12px; color: #aaa; margin-top: 4px; }
    
    .resources { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
    .res-item { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: bold; background: #222; padding: 4px 8px; border-radius: 12px; border: 1px solid #333; }
    .res-icon { width: 16px; height: 16px; background: #555; border-radius: 50%; display: inline-block; }
    
    .content { padding: 20px; text-align: center; color: #666; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Загрузка ресурсов...</p>
  </div>

  <div id="register-screen">
    <h2 style="text-align: center; margin-bottom: 20px;">Регистрация</h2>
    <div class="input-group">
      <label>Никнейм</label>
      <input type="text" id="reg-nickname" maxlength="15" placeholder="Ваш ник..." />
    </div>
    <div class="input-group">
      <label>Возраст</label>
      <input type="number" id="reg-age" min="10" max="100" placeholder="Ваш возраст..." />
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="reg-tutorial" />
      <label for="reg-tutorial">Играли ли вы раньше в подобные игры? (Отключит обучение)</label>
    </div>
    <button id="btn-register">Создать аккаунт</button>
  </div>

  <div id="main-screen">
    <div class="header">
      <div class="profile-info">
        <img id="ui-avatar" class="avatar" src="" alt="Avatar">
        <div class="names">
          <h3 id="ui-nickname">Никнейм</h3>
          <p>ID: <span id="ui-id">0</span></p>
          <p class="level-xp">Ур. <span id="ui-level">1</span> | <span id="ui-xp">0</span>/<span id="ui-max-xp">1000</span> XP</p>
        </div>
      </div>
      <div class="resources">
        <div class="res-item"><span class="res-icon" style="background:#9b59b6;"></span> <span id="ui-crystals">0</span></div>
        <div class="res-item"><span class="res-icon" style="background:#f1c40f;"></span> <span id="ui-coins">0</span></div>
        <div class="res-item"><span class="res-icon" style="background:#3498db;"></span> <span id="ui-mana">0</span></div>
      </div>
    </div>
    <div class="content">
      <h2>Добро пожаловать в Shadow Deck!</h2>
      <p style="margin-top: 10px;">Здесь скоро появится игровое поле.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
